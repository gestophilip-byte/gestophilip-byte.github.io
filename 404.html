<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f2eee4">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Page Not Found — Philip Gesto</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      display: grid;
      place-items: center;
      background: #f2eee4;
      color: #111111;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(760px, 100%);
      padding: clamp(32px, 7vw, 80px);
      border: 4px solid #111111;
      background: #dfff36;
      box-shadow: 14px 14px 0 #111111;
    }
    span {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 20px 0;
      font-size: clamp(70px, 18vw, 150px);
      line-height: .8;
      letter-spacing: -.06em;
    }
    p { max-width: 520px; font-size: 18px; line-height: 1.6; }
    a {
      margin-top: 20px;
      padding: 16px 20px;
      border: 3px solid #111111;
      display: inline-block;
      background: #111111;
      color: #f2eee4;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 6px 6px 0 #ff5c22;
    }
  </style>
</head>
<body>
  <main>
    <span>Error 404</span>
    <h1>Lost?</h1>
    <p>This page doesn’t exist, but the portfolio is still exactly where it should be.</p>
    <a href="/">Return to the portfolio →</a>
  </main>
</body>
</html>
